{% extends "base.html" %}
{% block title %}会员登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">会员登录</h4>
        <form method="post" novalidate>
          <div class="mb-3">
            <label class="form-label" for="phone">手机号</label>
            <input class="form-control" id="phone" name="phone" inputmode="numeric"
                   maxlength="11" required placeholder="11 位手机号">
            <div class="form-text">演示环境：口令为手机号后 6 位。</div>
          </div>
          <div class="mb-3">
            <label class="form-label" for="password">密码</label>
            <input class="form-control" id="password" name="password" type="password" required>
          </div>
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <hr>
        <a class="small" href="{{ url_for('auth.staff_login') }}">我是店员，走员工登录</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
