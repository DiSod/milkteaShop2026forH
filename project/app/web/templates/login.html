{% extends "base.html" %}
{% block title %}会员登录{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-5">
    <div class="login-hero">
      <img class="login-logo" src="{{ url_for('static', filename='img/logo.png') }}"
           alt="茶颜小铺 · Tea Face Shop">
    </div>
    <div class="card shadow-sm">
      <div class="card-body">
        <h4 class="card-title mb-3">会员登录</h4>
        <form method="post" novalidate>
          <div class="md-field mb-3">
            <input class="md-input" id="phone" name="phone" inputmode="numeric"
                   maxlength="11" required placeholder=" " autocomplete="username">
            <label class="md-label" for="phone">手机号</label>
            <div class="md-support">演示环境：口令为手机号后 6 位。</div>
          </div>
          <div class="md-field mb-3">
            <input class="md-input" id="password" name="password" type="password"
                   required placeholder=" " autocomplete="current-password">
            <label class="md-label" for="password">密码</label>
          </div>
          <button class="btn btn-primary w-100" type="submit">登录</button>
        </form>
        <hr>
        <a class="small" href="{{ url_for('auth.staff_login') }}">我是店员，走员工登录</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
