{% extends "base.html" %}
{% block title %}菜单 · 点单{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-baseline justify-content-between mb-3">
  <h4 class="mb-0">今日菜单</h4>
  <span class="small text-muted">点一下饮品，在弹出的窗口里选杯型、糖度、冰量与加料</span>
</div>

<form method="post" action="{{ url_for('member.place_order') }}">
  {% include "_menu_cards.html" %}

  <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
    <button class="btn btn-primary px-4" type="submit">
      <i class="bi bi-bag-check me-1"></i>提交订单
    </button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/menu.js') }}"></script>
{% endblock %}
