{% extends "base.html" %}
{% block title %}收银台 · 代客点单{% endblock %}
{% block content %}
<div class="d-flex flex-wrap align-items-baseline justify-content-between mb-3">
  <h4 class="mb-0">收银台</h4>
  <span class="small text-muted">填手机号 = 记在该会员名下并累积分；留空 = 散客单</span>
</div>

<form method="post" action="{{ url_for('cashier.place_order') }}">
  <div class="card mb-3">
    <div class="card-body d-flex flex-wrap align-items-end gap-3 py-3">
      <div class="md-field" style="min-width: 15rem;">
        <input class="md-input" id="member_phone" name="member_phone"
               placeholder=" " autocomplete="off" inputmode="numeric">
        <label class="md-label" for="member_phone">会员手机号（散客留空）</label>
        <div class="md-support">库里 <code>member_id</code> 可空，v0.1 已有 764 张散客单。</div>
      </div>
    </div>
  </div>

  {% include "_menu_cards.html" %}

  <div class="d-grid gap-2 d-md-flex justify-content-md-end mt-4">
    <button class="btn btn-primary px-4" type="submit">
      <i class="bi bi-cash-coin me-1"></i>收银下单
    </button>
  </div>
</form>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/menu.js') }}"></script>
{% endblock %}
